<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>减脂打卡</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --bg: #000; /* 整体黑底 */
      --card: #111; /* 卡片深灰 */
      --text: #fff; /* 主要白字 */
      --sub: #888; /* 次要灰字 */
      --green: #4CAF50; /* 主题绿 */
      --red: #f44336; /* 警示红 */
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      background: var(--green);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: #000;
      padding: 12px 16px;
      text-align: center;
      gap: 8px;
    }
    .stat strong {
      font-size: 20px;
      color: var(--green);
      display: block;
    }
    .stat span {
      font-size: 12px;
      color: var(--sub);
    }
    nav.tabs {
      display: flex;
      background: #111;
      border-bottom: 1px solid #333;
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 12px 0;
      color: var(--sub);
      cursor: pointer;
      border-bottom: 3px solid transparent;
    }
    .tab.active {
      color: var(--green);
      border-bottom-color: var(--green);
    }
    main {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .panel {
      background: var(--card);
      padding: 16px;
      border-radius: 8px;
      display: none;
    }
    .panel.active {
      display: block;
    }
    .panel h3 {
      margin: 0 0 12px;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .milestone {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #333;
    }
    .milestone .md {
      width: 24px;
      height: 24px;
      border: 2px solid var(--sub);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: var(--sub);
    }
    .milestone.achieved .md {
      background: var(--green);
      color: #000;
      border-color: var(--green);
    }
    .milestone .txt b {
      display: block;
      font-size: 14px;
    }
    .milestone .txt small {
      font-size: 11px;
      color: var(--sub);
    }
    .ck-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #333;
    }
    .ck-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--green);
    }
    .ck-item .lbl {
      flex: 1;
    }
    .ck-item .lbl b {
      display: block;
      font-size: 14px;
    }
    .ck-item .lbl small {
      font-size: 11px;
      color: var(--sub);
    }
    .ck-item .val {
      font-size: 12px;
      color: var(--green);
    }
    .btn {
      background: var(--green);
      color: #000;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
      margin-top: 16px;
    }
    footer {
      display: flex;
      background: #111;
      border-top: 1px solid #333;
    }
    .ft-tab {
      flex: 1;
      text-align: center;
      padding: 12px 0;
      color: var(--sub);
      cursor: pointer;
      font-size: 12px;
    }
    .ft-tab.active {
      color: var(--green);
    }
    .ft-tab svg {
      width: 20px;
      height: 20px;
      margin-bottom: 4px;
      fill: currentColor;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">⭐ 减脂打卡</div>
    <div style="font-size:12px;color:#fff">85kg → 65kg | 腰突安全减重</div>
  </header>

  <div class="stats">
    <div class="stat">
      <strong>85</strong>
      <span>体重</span>
    </div>
    <div class="stat">
      <strong>0</strong>
      <span>已减</span>
    </div>
    <div class="stat">
      <strong>0</strong>
      <span>打卡</span>
    </div>
    <div class="stat">
      <strong>0</strong>
      <span>连续</span>
    </div>
  </div>

  <nav class="tabs">
    <div class="tab active" onclick="go('checkin')">📋 打卡</div>
    <div class="tab" onclick="go('chart')">📈 曲线</div>
    <div class="tab" onclick="go('photo')">📷 对比</div>
    <div class="tab" onclick="go('progress')">🏆 进度</div>
  </nav>

  <main>
    <!-- 打卡面板 -->
    <div id="checkin" class="panel active">
      <h3>今日打卡 <small>坚持就是胜利！点击记录你今天的努力。</small></h3>
      <div id="ck-list"></div>
      <button class="btn" onclick="saveToday()">保存今日打卡</button>
    </div>

    <!-- 曲线面板 -->
    <div id="chart" class="panel">
      <h3>体重曲线 <small>记录每一次变化，见证进步</small></h3>
      <div style="height:160px;background:#1a1a1a;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--sub);">
        此处为图表占位（可后续接入 Chart.js）
      </div>
    </div>

    <!-- 对比面板 -->
    <div id="photo" class="panel">
      <h3>身材对比 <small>用照片记录蜕变</small></h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        <div style="background:#1a1a1a;border-radius:8px;padding:16px;text-align:center;color:var(--sub);">正面照</div>
        <div style="background:#1a1a1a;border-radius:8px;padding:16px;text-align:center;color:var(--sub);">侧面照</div>
      </div>
      <button class="btn" style="margin-top:12px;">上传照片</button>
    </div>

    <!-- 进度面板 -->
    <div id="progress" class="panel">
      <h3>减重进度 <small>已完成 0.0kg / 目标 20kg</small></h3>
      <div style="background:#1a1a1a;border-radius:8px;padding:16px;margin-bottom:12px;">
        <div style="height:8px;background:#333;border-radius:4px;overflow:hidden;">
          <div style="width:0%;height:100%;background:var(--green);"></div>
        </div>
        <div style="font-size:12px;color:var(--sub);margin-top:8px;">当前阶段：适应期</div>
      </div>
      <h4>里程碑</h4>
      <div id="milestone-list"></div>
    </div>
  </main>

  <footer>
    <div class="ft-tab active" onclick="go('checkin')">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-7h7v7zm0-10H7V5h7v2z"/></svg>
      <div>打卡</div>
    </div>
    <div class="ft-tab" onclick="go('chart')">
      <svg viewBox="0 0 24 24"><path d="M3.5 18.49l6-6.01 4 4L22 6.92l-5-5-7.01 7.01-1.5-1.5-3.49 3.5z"/></svg>
      <div>曲线</div>
    </div>
    <div class="ft-tab" onclick="go('photo')">
      <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 2.5 6.5-6.5-2.5-2.5-4 4-1.5-1.5z"/></svg>
      <div>对比</div>
    </div>
    <div class="ft-tab" onclick="go('progress')">
      <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      <div>进度</div>
    </div>
  </footer>

  <script>
    let curW = 85, curC = 90, days = 0, streak = 0, logs = [];
    function saveToday() {
      const today = new Date().toLocaleDateString();
      logs.push({ date: today, w: curW, c: curC, done: true });
      localStorage.setItem('fitnessLogs', JSON.stringify(logs));
      updateStats();
      renderCheckin();
      alert('打卡成功！');
    }
    function updateStats() {
      document.querySelectorAll('.stat strong')[0].textContent = curW;
      document.querySelectorAll('.stat strong')[1].textContent = (85 - curW);
      document.querySelectorAll('.stat strong')[2].textContent = days;
      document.querySelectorAll('.stat strong')[3].textContent = streak;
    }
    function renderCheckin() {
      const list = document.getElementById('ck-list');
      list.innerHTML = '';
      // 模拟数据，后续可扩展
      const items = [
        { t: '猫牛式', d: '5分钟', s: '早' },
        { t: '死虫伸展', d: '3组×10次', s: '早' },
        { t: '弹力带面拉', d: '3组×15次', s: '午' },
        { t: '弹力带肩袖', d: '3组×15次', s: '午' },
        { t: '站姿侧抬腿', d: '3组×15次', s: '晚' }
      ];
      items.forEach(it => {
        list.innerHTML += `
          <div class="ck-item">
            <input type="checkbox">
            <div class="lbl">
              <b>${it.t}</b>
              <small>${it.d}</small>
            </div>
            <div class="val">${it.s}</div>
          </div>
        `;
      });
    }
    函数 renderMilestones() {
      const ms = [
        [84,'减下第一斤！','好的开始'],
        [82,'减掉3斤','肚子不胀了'],
        [80,'减掉10斤','第一阶段完成！'],
        [78,'减掉14斤','系鞋带轻松了'],
        [75,'减掉20斤','腰椎压力明显减轻！'],
        [72,'减掉26斤','下颌线清晰'],
        [70,'减掉30斤','进入塑形冲刺！'],
        [67,'减掉36斤','体态挺拔'],
        [65,'目标达成40斤','全新人生！']
      ];
      let h = '';
      ms.forEach(m => {
        const ok = curW <= m[0];
        h += `<div class="milestone ${ok ? 'achieved' : ''}">
          <div class="md">${ok ? '✓' : m[0]}</div>
          <div class="txt">
${m[1]}
            <small>${m[2]}</small>
          </div>
        </div>`;
      });
      文档.getElementById('milestone-list').innerHTML = h;
    }
    函数 go(name) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.ft-tab').forEach(f => f.classList.remove('active'));
      const map = { checkin: 0, chart: 1, photo: 2, progress: 3 };
      document.querySelectorAll('.tab')]forEachfunction(item,索引){项目.classListadd'active';
      document.getElementById(name).classList.add('active');
      document.querySelectorAll('.ft-tab')[map[name]].classList.add('active');
      如果 (name === 'checkin') renderCheckin();
      否则 如果 (name === 'chart') renderChart();
      else if (name === 'photo') renderPhotos();
      else if (name === 'progress') renderProgress();
    }
    function renderChart() { /* 后续接入 Chart.js */ }
    function renderPhotos() { /* 后续接入相册 */ }
    函数 renderProgress() {
      renderMilestones();
      // 进度条示例
      document.querySelector('#progress .panel > div > div').style.width = ((85 - curW) / 20 * 100) + '%';
    }
    // 注册 Service Worker
    如果 ('serviceWorker'在navigator中){
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
    // 初始化
    renderCheckin();
    updateStats();
    renderMilestones();
  </script>
</body>
</html>
