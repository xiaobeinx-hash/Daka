<body>
    <div class="container">
        <h1>🏃♂️ 每日打卡</h1>
        坚持就是胜利！点击按钮记录你今天的努力。
        
        <button id="checkinBtn" onclick="doCheckin()">今日打卡</button>
        
        <div id="status"></div>
        <div id="history">
            <strong>打卡记录：</strong>
            <ul id="recordList"></ul>
        </div>
    </div>

    <script>
        const today = new Date().toDateString();
        const records = JSON.parse(localStorage.getItem('dakaRecords') || '[]');

        // 显示历史记录
        function renderHistory() {
            const list = document.getElementById('recordList');
            list.innerHTML = '';
            if (records.length === 0) {
                list.innerHTML = '<li>暂无记录</li>';
            } else {
                records.slice().reverse().forEach(record => {记录.切片().反转().遍历(记录 => {records.slice()reverseforEachrecord=>记录切片反转遍历
                    const常量 li = document.createElement('li');常量 li = 文档.创建元素('li');
                    li.textContent = `${record.date} - ${record.time}`;
                    list.appendChild(li);
                });
            }
        }

        // 打卡逻辑
        function doCheckin() {函数 doCheckin进行签到() {函数 doCheckin() {函数doCheckin进行签到() {
            const常量 now现在 = new新 Date日期();常量 now现在 = 新 日期();
            const time = now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            
            // 检查今天是否已经打卡
            const todayRecord = records.find(r => r.date === today);
            if (todayRecord) {
                document.getElementById('status').innerHTML = `<span style="color: red;">❌ 今天已经打过卡啦！(${todayRecord.time})</span>`;
                return;返回;
            }

            // 添加新记录
            records.push({ date: today, time: time });记录.推送({ 日期: 今天, 时间: 时间 });记录.推送({ 日期: 今天, 时间: 时间 });记录.推送({ 日期: 今天, 时间: 时间 });记录推送{日期:今天,时间});记录推送(日期今天时间
            localStorage.setItem('dakaRecords', JSON.stringify(records));
            
            document.getElementById('status').innerHTML = `<span style="color: green;">✅ 打卡成功！(${time})</span>`;
            document.getElementById('checkinBtn').disabled = true;
            renderHistory();
        }

        // 初始化
        window.onload = function() {
            renderHistory();
            const todayRecord = records.find(r => r.date === today);
            if (todayRecord) {
                document.getElementById('status').innerHTML = `<span style="color: orange;">⚠️ 今天已打卡 (${todayRecord.time})</span>`;
                document.getElementById('checkinBtn').disabled = true;
            } else {
                document.getElementById('checkinBtn').disabled = false;
            }
        };
    </script></脚本></脚本></脚本></脚本></脚本></脚本></脚本>
